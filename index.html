<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GLuna Lingua Kids - Vive el Idioma</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Fredoka',sans-serif}
body{background:#F0F4FF;color:#2D3748;min-height:100vh;padding-bottom:80px}

/* Onboarding */
#onboarding{position:fixed;inset:0;background:#F0F4FF;z-index:999;display:flex;align-items:center;justify-content:center;padding:16px}
.box{background:#fff;border-radius:24px;padding:24px;max-width:420px;width:100%;box-shadow:0 16px 40px rgba(0,0,0,.1);display:none;flex-direction:column;max-height:90vh;overflow-y:auto}
.box.active{display:flex}
.logo-img{width:110px;height:110px;border-radius:50%;object-fit:cover;margin:0 auto 12px;border:4px solid #E2E8F0;box-shadow:0 6px 16px rgba(0,0,0,.08)}
.opt{border:2px solid #EDF2F7;border-radius:16px;padding:12px 16px;margin:6px 0;cursor:pointer;font-weight:600;background:#fff;display:flex;align-items:center;gap:10px;transition:all .2s}
.opt:hover{border-color:#4D96FF;background:#F7FAFC}
.age-opt{border:2px solid #EDF2F7;border-radius:18px;padding:12px;text-align:center;cursor:pointer;font-weight:700;background:#fff;transition:all .2s}
.age-opt.sel,.opt.sel{background:#4D96FF!important;color:#fff!important;border-color:#4D96FF!important}
.btn{border:none;padding:14px;border-radius:16px;width:100%;font-weight:700;font-size:16px;cursor:pointer;background:linear-gradient(135deg,#FF6B6B,#4D96FF);color:#fff;margin-top:12px;box-shadow:0 4px 14px rgba(77,150,255,.4);transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn-ghost{background:#EDF2F7;color:#4A5568;box-shadow:none}

/* Header & Nav */
.header{background:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 18px rgba(0,0,0,.05);position:sticky;top:0;z-index:10}
.brand{display:flex;align-items:center;gap:10px}
.brand-img{width:38px;height:38px;border-radius:50%;object-fit:cover}
.score-badge{background:#FFF9DB;border:2px solid #FFD43B;border-radius:20px;padding:4px 12px;font-weight:700;font-size:14px;color:#D9480F}

.main{max-width:540px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:24px;padding:20px;margin-bottom:16px;box-shadow:0 8px 24px rgba(0,0,0,.05)}

/* Bottom Nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;box-shadow:0 -4px 20px rgba(0,0,0,.06);z-index:20}
.nav-tab{flex:1;padding:12px;text-align:center;font-weight:700;color:#A0AEC0;cursor:pointer;font-size:13px;transition:all .2s}
.nav-tab.active{color:#4D96FF;opacity:1}

/* Games & UI */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.cat-btn{background:#fff;border:none;border-radius:20px;padding:16px;text-align:left;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.06);display:flex;flex-direction:column;gap:6px;transition:transform .2s}
.cat-btn:hover{transform:translateY(-2px)}
.game-card{background:#fff;border:2px solid #EDF2F7;border-radius:16px;padding:12px;text-align:center;cursor:pointer;font-weight:700;font-size:12px;transition:all .2s}
.game-card:hover{border-color:#4D96FF;background:#F0F4FF}

/* Modal */
#modal{position:fixed;inset:0;background:#F0F4FF;z-index:100;display:none;flex-direction:column}
.modal-header{background:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.modal-body{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;max-width:480px;margin:0 auto;width:100%}

/* Memory / Match */
.memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.mem-card{height:80px;background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.08);border:2px solid #EDF2F7}
.mem-card.flipped{background:#EBF8FF;border-color:#3182CE}
.mem-card.matched{background:#C6F6D5;border-color:#38A169;visibility:hidden}

.blank{border-bottom:3px solid #4D96FF;padding:0 8px;font-weight:700;color:#2B6CB0;min-width:50px;display:inline-block;text-align:center}
</style>
</head>
<body>

<!-- ONBOARDING -->
<div id="onboarding">
  <div class="box active" id="step0">
    <img src="logo.webp.jpg" class="logo-img" alt="GLuna Lingua Kids">
    <h2 style="text-align:center">¡Hola! Soy Luna 🌙</h2>
    <p style="color:#718096;font-size:14px;text-align:center;margin:6px 0 16px">Bienvenido a GLuna Lingua Kids</p>

    <label style="font-size:13px;font-weight:700;color:#4A5568">¿Cómo te llamas?</label>
    <input id="kidName" style="width:100%;padding:12px;border:2px solid #EDF2F7;border-radius:14px;text-align:center;font-size:16px;font-weight:600;margin:6px 0 14px" placeholder="Ej: Gaddiel">

    <label style="font-size:13px;font-weight:700;color:#4A5568">¿Cuántos años tienes?</label>
    <div style="display:flex;gap:8px;margin:6px 0 12px">
      <input id="kidAgeInput" type="number" min="3" max="99" style="flex:1;padding:12px;border:2px solid #EDF2F7;border-radius:14px;text-align:center;font-size:16px;font-weight:700" placeholder="Escribe tu edad" oninput="kidAge=parseInt(this.value)||0">
    </div>

    <div class="grid-3" style="margin-bottom:12px">
      <div class="age-opt" id="age4" onclick="pickAge(4)">🧸<br><small>3-5 años</small></div>
      <div class="age-opt" id="age7" onclick="pickAge(7)">🎒<br><small>6-8 años</small></div>
      <div class="age-opt" id="age10" onclick="pickAge(10)">🚀<br><small>9-12 años</small></div>
    </div>

    <button class="btn" onclick="goStep1()">Continuar →</button>
  </div>

  <div class="box" id="step1">
    <h3 id="greetH">¡Hola!</h3>
    <p style="margin:10px 0;color:#718096">¿Qué idioma hablas en casa?</p>
    <div class="opt" onclick="pickNative('es')">🇪
