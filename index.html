function getLevenshtein(a,b){a=a.toLowerCase().trim();b=b.toLowerCase().trim();const m=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));for(let i=0;i<=a.length;i++)m[i][0]=i;for(let j=0;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++){const c=a[i-1]===b[j-1]?0:1;m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+c);}return m[a.length][b.length];}

else if(activeGame==='riddle'){const clues=["Empieza con "+target[0].toUpperCase()+" y tiene "+target.length+" letras","Es de "+currentCat+" "+item.emoji,"Suena como "+target.slice(0,2)+"..."];body.innerHTML='<div class="w-full space-y-3"><div class="text-6xl blur-[8px]">'+item.emoji+'</div><h3 class="font-bold">🤔 3 pistas</h3><div class="text-left bg-white p-3 rounded-2xl border text-xs space-y-2"><div class="bg-blue-50 p-2 rounded-lg">'+clues[0]+'</div><div class="bg-yellow-50 p-2 rounded-lg">'+clues[1]+'</div><div class="bg-green-50 p-2 rounded-lg">'+clues[2]+'</div></div><div id="riddleOpts" class="grid gap-2 w-full"></div></div>';let opts=[item];while(opts.length<3){let r=VOCAB[currentCat][Math.floor(Math.random()*VOCAB[currentCat].length)]; if(!opts.includes(r)) opts.push(r);}opts.sort(()=>Math.random()-.5);const d=document.getElementById('riddleOpts');opts.forEach(opt=>{const b=document.createElement('button');b.className='tf-btn';b.innerText=getWord(opt,user.learn)+' '+opt.emoji;b.onclick=()=>{if(opt===item){window.onLunaClose=nextStep;showFeedback(true);awardPoints(15);}else showFeedback(false);};d.appendChild(b);});}
else if(activeGame==='spell'){body.innerHTML='<div class="w-full space-y-3"><div class="text-7xl">'+item.emoji+'</div><h3 class="font-bold">✍️ Deletrea: '+native+'</h3><input id="spellIn" placeholder="Escribe en '+user.learn+'" class="w-full text-center text-lg font-bold p-3 border-2 border-sky-200 rounded-2xl"><div id="spellFb" class="text-sm font-bold min-h-[20px]"></div><div class="flex gap-2"><button onclick="speakWord(\''+target+'\')" class="flex-1 bg-sky-100 font-bold p-3 rounded-2xl">🔊</button><button onclick="checkSpell()" class="flex-1 bg-sky-500 text-white font-bold p-3 rounded-2xl">Comprobar</button></div></div>';window.checkSpell=()=>{const inp=document.getElementById('spellIn');const fb=document.getElementById('spellFb');if(inp.value.trim().toLowerCase()===target.toLowerCase()){fb.innerText='✅ ¡Correcto!';fb.style.color='green';window.onLunaClose=nextStep;showFeedback(true);awardPoints(15);}else{fb.innerText='❌ Era: '+target;fb.style.color='red';showFeedback(false);}};}
else if(activeGame==='match'){if(gameIdx===0) selectedMatch=null;let list=VOCAB[currentCat].slice(0,4);body.innerHTML='<h3 class="font-bold mb-2">🔗 Une emoji con palabra</h3><div class="grid grid-cols-2 gap-3 w-full"><div id="matchLeft" class="grid gap-2"></div><div id="matchRight" class="grid gap-2"></div></div><p class="text-xs mt-2"><span id="matchProg">0/4</span></p>';const left=document.getElementById('matchLeft');const right=document.getElementById('matchRight');let leftItems=[...list];let rightItems=[...list];rightItems.sort(()=>Math.random()-.5);leftItems.forEach(it=>{const b=document.createElement('button');b.className='tf-btn text-center';b.innerText=it.emoji;b.dataset.id=it.en;b.onclick=()=>{document.querySelectorAll('#matchLeft.tf-btn').forEach(x=>x.style.borderColor='#E2E8F0');b.style.borderColor='#63B3ED';selectedMatch=b;};left.appendChild(b);});let matched=0;rightItems.forEach(it=>{const b=document.createElement('button');b.className='tf-btn text-center';b.innerText=getWord(it,user.learn);b.dataset.id=it.en;b.onclick=()=>{if(!selectedMatch){showFeedback(false,'Elige emoji primero');return;}if(selectedMatch.dataset.id===b.dataset.id){selectedMatch.style.background='#C6F6D5';b.style.background='#C6F6D5';selectedMatch.style.pointerEvents='none';b.style.pointerEvents='none';matched++;document.getElementById('matchProg').innerText=matched+'/4';selectedMatch=null;if(matched===4){setTimeout(()=>{window.onLunaClose=()=>{closeModalGame();showCategories();};showFeedback(true,'¡4/4! +30⭐');awardPoints(30);},400);}}else{showFeedback(false);}};right.appendChild(b);});}
else if(activeGame==='speed'){if(gameIdx===0){timeLeft=60;}body.innerHTML='<div class="w-full space-y-3"><div class="flex justify-between w-full font-bold"><span>⚡ Rápido</span><span id="timeLeft" class="text-red-500">'+timeLeft+'s</span></div><div class="text-7xl">'+item.emoji+'</div><h3 class="text-2xl font-bold">'+target+'</h3><div id="speedOpts" class="grid grid-cols-2 gap-2 w-full"></div></div>';if(!timerInt){timerInt=setInterval(()=>{timeLeft--;const el=document.getElementById('timeLeft'); if(el) el.innerText=timeLeft+'s';if(timeLeft<=0){clearInterval(timerInt);timerInt=null;window.onLunaClose=()=>{closeModalGame();};showFeedback(true,'Tiempo: +'+(60-timeLeft)+' pts');awardPoints(Math.max(5,60-timeLeft));}},1000);}let opts=[item];while(opts.length<4){let r=VOCAB[currentCat][Math.floor(Math.random()*VOCAB[currentCat].length)]; if(!opts.includes(r)) opts.push(r);}opts.sort(()=>Math.random()-.5);const d=document.getElementById('speedOpts');opts.forEach(opt=>{const b=document.createElement('button');b.className='tf-btn text-center';b.innerText=getWord(opt,user.learn);b.onclick=()=>{if(opt===item){awardPoints(5);gameIdx=(gameIdx+1)%currentQueue.length;renderGameStep();}else{b.style.background='#FEB2B2';}};d.appendChild(b);});}
else if(activeGame==='story'){const list=VOCAB[currentCat].slice(0,3);const storyText="Había una vez "+user.name+" que tenía ___ "+list[0].emoji+" y encontró ___ "+list[1].emoji+" y comió ___ "+list[2].emoji+".";body.innerHTML='<div class="w-full space-y-3 text-left"><div class="bg-blue-50 border p-3 rounded-2xl"><h4 class="font-bold">📖 Cuento</h4><p id="storyText" class="mt-2">'+storyText.replace(/___/g,'<span class="blank font-bold text-sky-600 border-b-2 border-dashed px-2">___</span>')+'</p><p class="text-xs text-slate-500 mt-2">Tenía '+getWord(list[0],user.native)+', encontró '+getWord(list[1],user.native)+', comió '+getWord(list[2],user.native)+'</p></div><div id="storyOpts" class="flex flex-wrap gap-2"></div><button onclick="nextStep()" class="w-full bg-white border font-bold p-3 rounded-2xl mt-2">Siguiente cuento →</button></div>';const optsDiv=document.getElementById('storyOpts');list.forEach(it=>{const b=document.createElement('button');b.className='tf-btn w-auto px-4';b.innerText=getWord(it,user.learn);b.dataset.w=getWord(it,user.learn);b.onclick=()=>{const blanks=document.querySelectorAll('.blank');for(let bl of blanks){if(bl.innerText==='___'){bl.innerText=b.dataset.w;break;}}};optsDiv.appendChild(b);});}
else if(activeGame==='repeat'){body.innerHTML='<div class="w-full space-y-4"><div class="text-7xl">'+item.emoji+'</div><h3 class="text-2xl font-bold">'+target+'</h3><p class="text-xs text-slate-400">80% mínimo</p><div id="voiceStatus" class="p-3 rounded-2xl bg-slate-50 border text-xs font-bold">Presiona Hablar</div><div class="space-y-2"><button onclick="speakWord(\''+target+'\')" class="w-full bg-sky-100 font-bold p-3 rounded-2xl">🔊 Escuchar</button><button onclick="startVoice(\''+target+'\')" class="w-full bg-emerald-500 text-white font-bold p-4 rounded-2xl">🎤 Hablar</button><button onclick="skipToEnd()" class="text-xs font-bold text-amber-600 underline">Saltar al final ⏩</button></div></div>';}
}
function nextStep(){gameIdx++;renderGameStep();}
function skipToEnd(){const cur=currentQueue.splice(gameIdx,1)[0];currentQueue.push(cur);renderGameStep();}
function startVoice(target){const status=document.getElementById('voiceStatus');const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){const sim=Math.floor(Math.random()*21)+80;status.className="p-3 rounded-2xl bg-emerald-100 text-emerald-800 font-bold text-xs";status.innerText='Simulación: '+sim+'%';setTimeout(()=>{window.onLunaClose=nextStep;showFeedback(true);awardPoints(15);},800);return;}const rec=new SR();rec.lang=user.learn==='en'?'en-US':user.learn==='es'?'es-ES':'it-IT';status.innerText="Escuchando... 🎙️";status.className="p-3 rounded-2xl bg-yellow-100 text-amber-800 font-bold text-xs animate-pulse";rec.start();rec.onresult=(e)=>{const spoken=e.results[0][0].transcript;const score=calcSim(spoken,target);if(score>=80){status.className="p-3 rounded-2xl bg-emerald-100 text-emerald-800 font-bold text-xs";status.innerText=spoken+' • '+score+'% ¡Aprobado!';setTimeout(()=>{window.onLunaClose=nextStep;showFeedback(true);awardPoints(15);},800);}else{status.className="p-3 rounded-2xl bg-red-100 text-red-800 font-bold text-xs";status.innerText=spoken+' • '+score+'% (80%+)';showFeedback(false);}};}
function findItem(key){for(let cat in VOCAB){let f=VOCAB[cat].find(x=>x.en===key); if(f) return f;} return VOCAB.fruits[0];}
function renderNovels(){const list=document.getElementById('novelList');list.innerHTML='';NOVELS.forEach(n=>{const hasReq=n.req.every(c=>user.completedCats.includes(c));const done=user.completedNovels.includes(n.id);const card=document.createElement('div');card.className='p-4 bg-white rounded-3xl border-2 shadow-sm space-y-2 '+(done?'border-emerald-300':hasReq?'border-purple-200':'border-slate-100 opacity-80');card.innerHTML='<div class="flex justify-between"><h3 class="font-bold text-sm">'+n.title+'</h3>'+(done?'<span class="text-xs bg-emerald-100 px-2 py-0.5 rounded-full">✓</span>':n.free?'<span class="text-xs bg-green-100 px-2 py-0.5 rounded-full">GRATIS</span>':'<span class="text-xs bg-red-100 px-2 py-0.5 rounded-full">🔒 PRO</span>')+'</div><p class="text-xs text-slate-500">Requiere: <b>'+n.reqNames+'</b></p>'+(hasReq?'<button onclick="playNovel('+n.id+')" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold p-3 rounded-2xl text-xs">'+(done?'Volver a leer':'¡Resolver! +40⭐')+'</button>':'<div class="p-2.5 bg-amber-50 rounded-2xl text-[11px] font-semibold">🔒 Completa '+n.reqNames+'</div>');list.appendChild(card);});const allDone=NOVELS.every(n=>user.completedNovels.includes(n.id));const final=document.createElement('div');final.className='p-5 rounded-3xl text-center space-y-3 '+(allDone?'bg-gradient-to-r from-yellow-300 to-orange-400 shadow-xl border-4 border-yellow-100':'bg-slate-200 opacity-60');final.innerHTML='<div class="text-4xl">✨ 🌙 🦋 🐝 🐿️ ✨</div><h3 class="font-bold">Gran Final</h3>'+(allDone?'<button onclick="awardPoints(100);showFeedback(true,\'¡100⭐!\');" class="w-full bg-slate-900 text-white font-bold p-3 rounded-2xl text-xs">✨ Final +100⭐</button>':'<span class="text-xs bg-slate-300 px-3 py-1 rounded-full">Completa 8 novelas</span>');list.appendChild(final);}
function playNovel(id){const n=NOVELS.find(x=>x.id===id);if(!n.req.every(c=>user.completedCats.includes(c))){showFeedback(false,'Bloqueado: '+n.reqNames);return;}let answers={};document.getElementById('modalGameTitle').innerText=n.title;document.getElementById('modalGame').classList.remove('hidden');document.getElementById('modalGame').classList.add('flex');const renderUI=()=>{let story=n.story.replace('{name}',user.name);n.blanks.forEach(b=>{const filled=answers[b];const word=getWord(findItem(b),user.learn);const html=filled?'<span class="font-bold text-indigo-600 underline bg-indigo-50 rounded-lg px-1">'+word+'</span>':'<span class="font-bold text-slate-400 border-b-2 border-indigo-400 px-3">___</span>';story=story.replace('['+b+']',html);});let need=n.blanks.find(b=>!answers[b]);const body=document.getElementById('modalGameBody');body.innerHTML='<div class="w-full space-y-4 text-left"><div class="p-3 bg-amber-50 border rounded-2xl text-xs"><b>💡 '+user.native.toUpperCase()+':</b> '+n.nativeStory+'</div><div class="p-4 bg-white border-2 border-indigo-100 rounded-3xl font-semibold">'+story+'</div>'+(need?'<div class="space-y-2"><p class="text-xs text-center font-bold uppercase">Elige en '+user.learn.toUpperCase()+':</p><div id="novelOpts" class="grid grid-cols-2 gap-2"></div></div>':'<button id="btnFinish" class="w-full bg-emerald-500 text-white font-bold p-4 rounded-2xl">🎉 ¡Completar! +40⭐</button>')+'</div>';if(need){const target=findItem(need);let choices=[target];while(choices.length<4){let rc=n.req[Math.floor(Math.random()*n.req.length)];let ri=VOCAB[rc][Math.floor(Math.random()*VOCAB[rc].length)]; if(!choices.includes(ri)) choices.push(ri);}choices.sort(()=>Math.random()-.5);const opts=document.getElementById('novelOpts');choices.forEach(ch=>{const w=getWord(ch,user.learn);const btn=document.createElement('button');btn.className="p-3 bg-indigo-50 border-2 border-indigo-100 rounded-2xl font-bold text-sm";btn.innerText=ch.emoji+' '+w;btn.onclick=()=>{if(ch===target){answers[need]=true;renderUI();}else{btn.classList.add('border-red-400');}};opts.appendChild(btn);});}else{document.getElementById('btnFinish').onclick=()=>{if(!user.completedNovels.includes(n.id)){user.completedNovels.push(n.id);awardPoints(40);}window.onLunaClose=()=>{closeModalGame();renderNovels();};showFeedback(true,'+40⭐');};}};renderUI();}
window.onload=()=>{loadUserData();updateHeader();renderCategories();renderNovels();document.getElementById('navH').classList.add('active-tab');};
</script>
</body>
