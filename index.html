,{en:"school",es:"escuela",emoji:"🏫"},{en:"bag",es:"mochila",emoji:"🎒"},{en:"ruler",es:"regla",emoji:"📏"},{en:"scissors",es:"tijeras",emoji:"✂️"},{en:"desk",es:"escritorio",emoji:"🪑"},{en:"paper",es:"papel",emoji:"📄"},{en:"map",es:"mapa",emoji:"🗺️"},{en:"paint",es:"pintura",emoji:"🎨"}],body:[{en:"hand",es:"mano",emoji:"✋"},{en:"eye",es:"ojo",emoji:"👁️"},{en:"head",es:"cabeza",emoji:"🧑"},{en:"nose",es:"nariz",emoji:"👃"},{en:"mouth",es:"boca",emoji:"👄"},{en:"ear",es:"oreja",emoji:"👂"},{en:"arm",es:"brazo",emoji:"💪"},{en:"leg",es:"pierna",emoji:"🦵"},{en:"foot",es:"pie",emoji:"🦶"},{en:"hair",es:"pelo",emoji:"💇"},{en:"heart",es:"corazon",emoji:"❤️"},{en:"smile",es:"sonrisa",emoji:"😊"}],emotions:[{en:"happy",es:"feliz",emoji:"😀"},{en:"sad",es:"triste",emoji:"😢"},{en:"angry",es:"enojado",emoji:"😡"},{en:"surprised",es:"sorprendido",emoji:"😲"},{en:"tired",es:"cansado",emoji:"😴"},{en:"scared",es:"asustado",emoji:"😱"},{en:"excited",es:"emocionado",emoji:"🤩"},{en:"calm",es:"tranquilo",emoji:"😌"},{en:"brave",es:"valiente",emoji:"🦁"},{en:"funny",es:"divertido",emoji:"😜"},{en:"shy",es:"timido",emoji:"😳"},{en:"loved",es:"amado",emoji:"🥰"}]};
const CATS=[{id:'fruits',name:'Frutas',icon:'🍎'},{id:'animals',name:'Animales',icon:'🦁'},{id:'colors',name:'Colores',icon:'🎨'},{id:'food',name:'Comida',icon:'🍕'},{id:'numbers',name:'Numeros',icon:'🔢'},{id:'clothing',name:'Ropa',icon:'👕'},{id:'house',name:'En Casa',icon:'🏠'},{id:'transport',name:'Transporte',icon:'🚀'},{id:'nature',name:'Naturaleza',icon:'🌳'},{id:'school',name:'Escuela',icon:'🏫'},{id:'body',name:'Cuerpo',icon:'🖐️'},{id:'emotions',name:'Emociones',icon:'🎭'}];
const NOVELS=[{id:1,title:"1. El Mercado",free:true,req:['fruits','food'],reqNames:"Frutas y Comida",blanks:['apple','cheese','bread'],story:"{name} en el Mercado compro [apple], vio [cheese] y comio [bread]."},{id:2,title:"2. El Bosque",free:true,req:['animals','nature'],reqNames:"Animales y Naturaleza",blanks:['lion','tree','sun'],story:"{name} vio un [lion] junto a un [tree] bajo el [sun]."},{id:3,title:"3. Fiesta",free:false,req:['colors','clothing','emotions'],reqNames:"Colores, Ropa y Emociones",blanks:['shirt','red','happy'],story:"{name} con [shirt] [red] muy [happy]."},{id:4,title:"4. Viaje",free:false,req:['transport','house','school'],reqNames:"Transporte, Casa y Escuela",blanks:['bus','house','bag'],story:"{name} con [bag] salio de [house] al [bus]."},{id:5,title:"5. Castillo",free:false,req:['clothing','colors','house'],reqNames:"Ropa, Colores, Casa",blanks:['hat','gold','bed'],story:"[hat] [gold] en [bed]."},{id:6,title:"6. Mar",free:false,req:['animals','nature','colors'],reqNames:"Animales, Naturaleza, Colores",blanks:['fish','blue','sea'],story:"[fish] en [sea] [blue]."},{id:7,title:"7. Carrera",free:false,req:['transport','numbers','emotions'],reqNames:"Transporte, Numeros, Emociones",blanks:['car','one','excited'],story:"[car] numero [one] [excited]."},{id:8,title:"8. Desfile",free:false,req:['school','body','food'],reqNames:"Escuela, Cuerpo, Comida",blanks:['book','hand','pizza'],story:"[hand] con [book] y [pizza]."}];
let user={name:'Gaddiel',age:7,native:'es',learn:'en',score:0,completedCats:[],completedNovels:[]};
let currentCat='fruits',currentQueue=[],gameIdx=0,activeGame='',selectedMatch=null,memoryFirst=null,memoryMatches=0,timerInt=null,timeLeft=60;
function getLevenshtein(a,b){a=a.toLowerCase().trim();b=b.toLowerCase().trim();const m=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));for(let i=0;i<=a.length;i++)m[i][0]=i;for(let j=0;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++){const c=a[i-1]===b[j-1]?0:1;m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+c);}return m[a.length][b.length];}
function calcSim(a,b){const d=getLevenshtein(a,b);const ml=Math.max(a.length,b.length);return ml===0?100:Math.round((1-d/ml)*100);}
function pickAge(a){user.age=a;document.querySelectorAll('.age-btn').forEach(b=>b.classList.remove('bg-sky-200'));try{event.target.classList.add('bg-sky-200');}catch(e){}}
function forceEnter(){try{const n=document.getElementById('kidName').value.trim();if(n) user.name=n; document.getElementById('step0').classList.add('hidden');document.getElementById('step1').classList.remove('hidden');document.getElementById('greetH').innerText='¡Hola, '+user.name+'!';}catch(e){document.getElementById('onboarding').style.display='none';}}
function goStep(n){try{if(n===1){const name=document.getElementById('kidName').value.trim();if(name) user.name=name; if(!user.name) user.name='Gaddiel';} document.getElementById('step0').classList.add('hidden');document.getElementById('step1').classList.add('hidden');document.getElementById('step2').classList.add('hidden');document.getElementById('step'+n).classList.remove('hidden'); if(n===1){document.getElementById('greetH').innerText='¡Hola, '+user.name+'!';}}catch(e){forceEnter();}}
function pickNative(lang){try{user.native=lang;const opts=document.getElementById('learnOptions');opts.innerHTML='';const LANGS={es:'Español',en:'English',it:'Italiano',fr:'Francais',de:'Deutsch',ja:'Japones'};for(let k in LANGS){if(k===user.native)continue;const btn=document.createElement('button');btn.className="w-full p-3 border-2 rounded-2xl";btn.innerHTML=LANGS[k];btn.onclick=()=>{user.learn=k;saveUserData();document.getElementById('onboarding').style.display='none';};opts.appendChild(btn);}goStep(2);}catch(e){user.learn='en';saveUserData();document.getElementById('onboarding').style.display='none';}}
function loadUserData(){const s=localStorage.getItem('gluna_final'); if(s){try{user=JSON.parse(s); document.getElementById('onboarding').style.display='none';}catch(e){}}}
function saveUserData(){try{localStorage.setItem('gluna_final',JSON.stringify(user));}catch(e){}updateHeader();}
function updateHeader(){try{document.getElementById('hProfile').innerText=user.name+' ('+user.age+'a) • '+user.learn.toUpperCase();document.getElementById('homeName').innerText=user.name;document.getElementById('score').innerText=user.score;document.getElementById('modalScore').innerText=user.score;const prog=Math.min(100,Math.round((user.completedCats.length/12)*100));document.getElementById('progBar').style.width=prog+'%';document.getElementById('progText').innerText=prog+'%';}catch(e){}}
function switchTab(t){document.getElementById('tabHome').classList.add('hidden');document.getElementById('tabAprender').classList.add('hidden');document.getElementById('tabNovela').classList.add('hidden');document.getElementById('navH').classList.remove('active-tab');document.getElementById('navA').classList.remove('active-tab');document.getElementById('navN').classList.remove('active-tab'); if(t==='aprender'){document.getElementById('tabAprender').classList.remove('hidden');document.getElementById('navA').classList.add('active-tab');}else if(t==='novela'){document.getElementById('tabNovela').classList.remove('hidden');document.getElementById('navN').classList.add('active-tab');renderNovels();}else{document.getElementById('tabHome').classList.remove('hidden');document.getElementById('navH').classList.add('active-tab');}}
function getWord(item,lang){return item[lang||user.learn]||item.en;}
function speakWord(text,lang){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const l=lang||user.learn;u.lang=l==='en'?'en-US':l==='es'?'es-ES':l==='it'?'it-IT':l==='fr'?'fr-FR':l==='de'?'de-DE':'ja-JP';speechSynthesis.speak(u);}catch(e){}}
function renderCategories(){const grid=document.getElementById('catGrid');grid.innerHTML='';CATS.forEach(c=>{const done=user.completedCats.includes(c.id);const card=document.createElement('button');card.className='p-4 bg-white rounded-3xl border-2 text-left shadow-sm '+(done?'border-emerald-300':'border-sky-100');card.onclick=()=>selectCategory(c.id);card.innerHTML='<span class="text-3xl">'+c.icon+'</span><h4 class="font-bold text-sm mt-2">'+c.name+'</h4>';grid.appendChild(card);});}
function selectCategory(id){currentCat=id;document.getElementById('catListView').classList.add('hidden');document.getElementById('gameSelectionView').classList.remove('hidden');document.getElementById('selCatIcon').innerText=CATS.find(x=>x.id===id).icon;document.getElementById('selCatName').innerText=CATS.find(x=>x.id===id).name;}
function showCategories(){document.getElementById('catListView').classList.remove('hidden');document.getElementById('gameSelectionView').classList.add('hidden');renderCategories();}
function launchGame(mode){activeGame=mode;gameIdx=0;currentQueue=[...VOCAB[currentCat]];document.getElementById('modalGameTitle').innerText=mode;document.getElementById('modalGame').classList.remove('hidden');document.getElementById('modalGame').classList.add('flex');renderGameStep();}
function closeModalGame(){document.getElementById('modalGame').classList.add('hidden');document.getElementById('modalGame').classList.remove('flex');if(timerInt){clearInterval(timerInt);timerInt=null;}}
function awardPoints(pts){user.score+=pts;if(!user.completedCats.includes(currentCat)) user.completedCats.push(currentCat);saveUserData();}
function showFeedback(ok,msg){const div=document.createElement('div');div.className='luna-feedback-box';let balloons='';if(ok){balloons='<div class="balloon-container">';for(let i=0;i<5;i++){let l=Math.random()*80+10;let c=['#FF6B6B','#4D96FF','#6BCB77','#FFD93D','#845EC2'][i%5];balloons+='<div class="balloon" style="left:'+l+'%;background:'+c+'" onclick="this.remove()">POP</div>';}balloons+='</div>';}div.innerHTML=balloons+'<div class="luna-feedback-card"><div class="text-5xl">'+(ok?'🌟':'😢')+'</div><h3 class="font-bold mt-2">'+(msg||(ok?'¡Excelente!':'¡Casi!'))+'</h3><button class="w-full mt-4 bg-sky-500 text-white font-bold p-3 rounded-2xl" onclick="this.closest(\'.luna-feedback-box\').remove(); if(window.onLunaClose) window.onLunaClose();">Continuar</button></div>';document.body.appendChild(div);}
function clearData(){localStorage.removeItem('gluna_final');location.reload();}
function renderGameStep(){const body=document.getElementById('modalGameBody');body.innerHTML='';if(gameIdx>=currentQueue.length && activeGame!=='memory' && activeGame!=='match' && activeGame!=='speed'){body.innerHTML='<div class="space-y-4"><div class="text-6xl">🎉</div><h3 class="text-2xl font-bold text-sky-600">¡Completado!</h3><button onclick="closeModalGame();showCategories();" class="w-full bg-sky-500 text-white font-bold p-3 rounded-2xl">Continuar</button></div>';awardPoints(20);return;}const item=currentQueue[gameIdx];const target=getWord(item,user.learn);const native=getWord(item,user.native);
if(activeGame==='cards'){body.innerHTML='<div class="w-full space-y-3"><div class="text-8xl">'+item.emoji+'</div><h2 class="text-3xl font-bold">'+target+'</h2><p class="text-sm text-slate-400">('+native+')</p><div class="flex gap-2"><button onclick="speakWord(\''+target+'\')" class="flex-1 bg-sky-100 font-bold p-3 rounded-2xl">🔊</button><button onclick="nextStep()" class="flex-1 bg-sky-500 text-white font-bold p-3 rounded-2xl">→</button></div></div>';speakWord(target);}
else if(activeGame==='quiz'){let opts=[item];while(opts.length<4){let r=VOCAB[currentCat][Math.floor(Math.random()*VOCAB[currentCat].length)]; if(!opts.includes(r)) opts.push(r);}opts.sort(()=>Math.random()-.5);body.innerHTML='<div class="w-full space-y-3"><div class="text-7xl">'+item.emoji+'</div><h3 class="font-bold">¿Como se dice '+native+'?</h3><div id="quizOpts" class="grid gap-2 w-full"></div></div>';const d=document.getElementById('quizOpts');opts.forEach(opt=>{const b=document.createElement('button');b.className="tf-btn";b.innerText=getWord(opt,user.learn);b.onclick=()=>{if(opt===item){window.onLunaClose=nextStep;showFeedback(true);awardPoints(10);}else{b.style.background='#FEB2B2';showFeedback(false);}};d.appendChild(b);});}
else if(activeGame==='tf'){const isTrue=Math.random()>0.5;let wrong=VOCAB[currentCat].find(x=>x!==item)||item;const displayed=isTrue?target:getWord(wrong,user.learn);body.innerHTML='<div class="w-full space-y-4"><div class="text-8xl">'+item.emoji+'</div><p class="text-sm">¿Es correcto?</p><h3 class="text-2xl font-bold border-2 p-3 rounded-2xl">'+displayed+'</h3><div class="flex gap-3"><button id="bT" class="flex-1 bg-emerald-500 text-white font-bold p-4 rounded-2xl">SI</button><button id="bF" class="flex-1 bg-red-500 text-white font-bold p-4 rounded-2xl">NO</button></div></div>';document.getElementById('bT').onclick=()=>{if(isTrue){window.onLunaClose=nextStep;showFeedback(true);awardPoints(10);}else showFeedback(false);};document.getElementById('bF').onclick=()=>{if(!isTrue){window.onLunaClose=nextStep;showFeedback(true);awardPoints(10);}else showFeedback(false);};}
else if(activeGame==='memory'){if(gameIdx===0){memoryFirst=null;memoryMatches=0;}let pairs=VOCAB[currentCat].slice(0,6);let cards=[];pairs.forEach(p=>{cards.push({id:p.en,show:p.emoji});cards.push({id:p.en,show:getWord(p,user.learn)});});cards.sort(()=>Math.random()-.5);body.innerHTML='<h3 class="font-bold mb-2">Memoria 6 pares</h3><div id="memGrid" class="grid grid-cols-3 gap-2 w-full"></div><p class="text-xs mt-2"><span id="memProg">0/6</span></p>';const grid=document.getElementById('memGrid');cards.forEach(c=>{const div=document.createElement('div');div.className='mem-card';div.innerText='?';div.dataset.id=c.id;div.dataset.show=c.show;div.onclick=()=>{if(div.classList.contains('matched')||div.classList.contains('revealed'))return;div.innerText=div.dataset.show;div.classList.add('revealed');if(!memoryFirst){memoryFirst=div;}else{if(memoryFirst.dataset.id===div.dataset.id && memoryFirst!==div){memoryFirst.classList.add('matched');div.classList.add('matched');memoryMatches++;document.getElementById('memProg').innerText=memoryMatches+'/6';memoryFirst=null;if(memoryMatches===6){setTimeout(()=>{window.onLunaClose=()=>{closeModalGame();showCategories();};showFeedback(true,'¡6 pares! +30');awardPoints(30);},400);}}else{const f=memoryFirst;setTimeout(()=>{f.innerText='?';div.innerText='?';f.classList.remove('revealed');div.classList.remove('revealed');memoryFirst=null;},800);memoryFirst=null;}}};grid.appendChild(div);});}
else if(activeGame==='listen'){body.innerHTML='<div class="w-full space-y-4"><div class="text-7xl">👂</div><h3 class="font-bold">Escucha y elige</h3><button onclick="speakWord(\''+target+'\')" class="w-full bg-sky-100 font-bold p-4 rounded-2xl">Escuchar</button><div id="listenOpts" class="grid gap-2 w-full"></div></div>';speakWord(target);let opts=[item];while(opts.length<4){let r=VOCAB[currentCat][Math.floor(Math.random()*VOCAB[currentCat].length)]; if(!opts.includes(r)) opts.push(r);}opts.sort(()=>Math.random()-.5);const d=document.getElementById('listenOpts');opts.forEach(opt=>{const b=document.createElement('button');b.className='tf-btn';b.innerText=opt.emoji+' '+getWord(opt,user.learn);b.onclick=()=>{if(opt===item){window.onLunaClose=nextStep;showFeedback(true);awardPoints(10);}else{b.style.background='#FEB2B2';showFeedback(false);}};d.appendChild(b);});}
else if(activeGame==='riddle'){const clues=["Empieza con "+target[0].toUpperCase()+" y tiene "+target.length+" letras","Es de "+currentCat+" "+item.emoji,"Suena como "+target.slice(0,2)+"..."];body.innerHTML='<div class="w-full space-y-3"><div class="text-6xl blur-[8px]">'+item.emoji+'</div><h3 class="font-bold">3 pistas</h3><div class="text-left bg-white p-3 rounded-2xl border text-xs space-y-2"><div class="bg-blue-50 p-2 rounded-lg">'+clues[0]+'</div><div class="bg-yellow-50 p-2 rounded-lg">'+clues[1]+'</div><div class="bg-green-50 p-2 rounded-lg">'+clues[2]+'</div></div><div id="riddleOpts" class="grid gap-2 w-full"></div></div>';let opts=[item];while(opts.length<3){let r=VOCAB[currentCat][Math.floor(Math.random()*VOCAB[currentCat].length)]; if(!opts.includes(r)) opts.push(r);}opts.sort(()=>Math.random()-.5);const d=document.getElementById('riddleOpts');opts.forEach(opt=>{const b=document.createElement('button');b.className='tf-btn';b.innerText=getWord(opt,user.learn)+' '+opt.emoji;b.onclick=()=>{if(opt===item){window.onLunaClose=nextStep;showFeedback(true);awardPoints(15);}else showFeedback(false);};d.appendChild(b);});}
else if(activeGame==='spell'){body.innerHTML='<div class="w-full space-y-3"><div class="text-7xl">'+item.emoji+'</div><h3 class="font-bold">Deletrea: '+native+'</h3><input id="spellIn" placeholder="Escribe" class="w-full text-center text-lg font-bold p-3 border-2 border-sky-200 rounded-2xl"><div id="spellFb" class="text-sm font-bold min-h-[20px]"></div><div class="flex gap-2"><button onclick="speakWord(\''+target+'\')" class="flex-1 bg-sky-100 font-bold p-3 rounded-2xl">Escuchar</button><button onclick="checkSpell()" class="flex-1 bg-sky-500 text-white font-bold p-3 rounded-2xl">Comprobar</button></div></div>';window.checkSpell=()=>{const inp=document.getElementById('spellIn');const fb=document.getElementById('spellFb');if(inp.value.trim().toLowerCase()===target.toLowerCase()){fb.innerText='Correcto';fb.style.color='green';window.onLunaClose=nextStep;showFeedback(true);awardPoints(15);}else{fb.innerText='Era: '+target;fb.style.color='red';showFeedback(false);}};}
else if(activeGame==='match'){if(gameIdx===0) selectedMatch=null;let list=VOCAB[currentCat].slice(0,4);body.innerHTML='<h3 class="font-bold mb-2">Une emoji con palabra</h3><div class="grid grid-cols-2 gap-3 w-full"><div id="matchLeft" class="grid gap-2"></div><div id="matchRight" class="grid gap-2"></div></div><p class="text-xs mt-2"><span id="matchProg">0/4</span></p>';const left=document.getElementById('matchLeft');const right=document.getElementById('matchRight');let leftItems=[...list];let rightItems=[...list];rightItems.sort(()=>Math.random()-.5);leftItems.forEach(it=>{const b=document.createElement('button');b.className='tf-btn text-center';b.innerText=it.emoji;b.dataset.id=it.en;b.onclick=()=>{selectedMatch=b;};left.appendChild(b);});let matched=0;rightItems.forEach(it=>{const b=document.createElement('button');b.className='tf-btn text-center';b.innerText=getWord(it,user.learn);b.dataset.id=it.en;b.onclick=()=>{if(!selectedMatch){showFeedback(false,'Elige emoji primero');return;}if(selectedMatch.dataset.id===b.dataset.id){selectedMatch.style.background='#C6F6D5';b.style.background='#C6F6D5';matched++;document.getElementById('matchProg').innerText=matched+'/4';selectedMatch=null;if(matched===4){setTimeout(()=>{window.onLunaClose=()=>{closeModalGame();showCategories();};showFeedback(true,'¡4/4! +30');awardPoints(30);},400);}}else{showFeedback(false);}};right.appendChild(b);});}
else if(activeGame==='speed'){if(gameIdx===0){timeLeft=60;}body.innerHTML='<div class="w-full space-y-3"><div class="flex justify-between w-full font-bold"><span>Rapido</span><span id="timeLeft" class="text-red-500">'+timeLeft+'s</span></div><div class="text-7xl">'+item.emoji+'</div><h3 class="text-2xl font-bold">'+target+'</h3><div id="speedOpts" class="grid grid-cols-2 gap-2 w-full"></div></div>';if(!timerInt){timerInt=setInterval(()=>{timeLeft--;const el=document.getElementById('timeLeft'); if(el) el.innerText=timeLeft+'s';if(timeLeft<=0){clearInterval(timerInt);timerInt=null;window.onLunaClose=()=>{closeModalGame();};showFeedback(true,'Tiempo: '+(60-timeLeft)+' pts');awardPoints(Math.max(5,60-timeLeft));}},1000);}let opts=[item];while(opts.length<4){let r=VOCAB[currentCat][Math.floor(Math.random()*VOCAB[currentCat].length)]; if(!opts.includes(r)) opts.push(r);}opts.sort(()=>Math.random()-.5);const d=document.getElementById('speedOpts');opts.forEach(opt=>{const b=document.createElement('button');b.className='tf-btn text-center';b.innerText=getWord(opt,user.learn);b.onclick=()=>{if(opt===item){awardPoints(5);gameIdx=(gameIdx+1)%currentQueue.length;renderGameStep();}else{b.style.background='#FEB2B2';}};d.appendChild(b);});}
else if(activeGame==='story'){const list=VOCAB[currentCat].slice(0,3);const storyText="Habia una vez "+user.name+" que tenia ___ "+list[0].emoji+" y encontro ___ "+list[1].emoji+" y comio ___ "+list[2].emoji+".";body.innerHTML='<div class="w-full space-y-3 text-left"><div class="bg-blue-50 border p-3 rounded-2xl"><h4 class="font-bold">Cuento</h4><p class="mt-2">'+storyText.replace(/___/g,'<span class="blank font-bold text-sky-600 border-b-2 border-dashed px-2">___</span>')+'</p></div><div id="storyOpts" class="flex flex-wrap gap-2"></div><button onclick="nextStep()" class="w-full bg-white border font-bold p-3 rounded-2xl mt-2">Siguiente</button></div>';const optsDiv=document.getElementById('storyOpts');list.forEach(it=>{const b=document.createElement('button');b.className='tf-btn w-auto px-4';b.innerText=getWord(it,user.learn);b.dataset.w=getWord(it,user.learn);b.onclick=()=>{const blanks=document.querySelectorAll('.blank');for(let bl of blanks){if(bl.innerText==='___'){bl.innerText=b.dataset.w;break;}}};optsDiv.appendChild(b);});}
else if(activeGame==='repeat'){body.innerHTML='<div class="w-full space-y-4"><div class="text-7xl">'+item.emoji+'</div><h3 class="text-2xl font-bold">'+target+'</h3><p class="text-xs">80% minimo</p><div id="voiceStatus" class="p-3 rounded-2xl bg-slate-50 border text-xs font-bold">Presiona Hablar</div><div class="space-y-2"><button onclick="speakWord(\''+target+'\')" class="w-full bg-sky-100 font-bold p-3 rounded-2xl">Escuchar</button><button onclick="startVoice(\''+target+'\')" class="w-full bg-emerald-500 text-white font-bold p-4 rounded-2xl">Hablar</button><button onclick="skipToEnd()" class="text-xs underline">Saltar al final</button></div></div>';}
}
function nextStep(){gameIdx++;renderGameStep();}
function skipToEnd(){const cur=currentQueue.splice(gameIdx,1)[0];currentQueue.push(cur);renderGameStep();}
function startVoice(target){const status=document.getElementById('voiceStatus');const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){const sim=Math.floor(Math.random()*21)+80;status.className="p-3 rounded-2xl bg-emerald-100 text-emerald-800 font-bold text-xs";status.innerText='Simulacion: '+sim+'%';setTimeout(()=>{window.onLunaClose=nextStep;showFeedback(true);awardPoints(15);},800);return;}const rec=new SR();rec.lang=user.learn==='en'?'en-US':user.learn==='es'?'es-ES':'it-IT';status.innerText="Escuchando...";rec.start();rec.onresult=(e)=>{const spoken=e.results[0][0].transcript;const score=calcSim(spoken,target);if(score>=80){status.innerText=spoken+' • '+score+'% Aprobado';setTimeout(()=>{window.onLunaClose=nextStep;showFeedback(true);awardPoints(15);},800);}else{status.innerText=spoken+' • '+score+'% (80%+)';showFeedback(false);}};}
function findItem(key){for(let cat in VOCAB){let f=VOCAB[cat].find(x=>x.en===key); if(f) return f;} return VOCAB.fruits[0];}
function renderNovels(){const list=document.getElementById('novelList');list.innerHTML='';NOVELS.forEach(n=>{const hasReq=n.req.every(c=>user.completedCats.includes(c));const done=user.completedNovels.includes(n.id);const card=document.createElement('div');card.className='p-4 bg-white rounded-3xl border-2 space-y-2 '+(done?'border-emerald-300':hasReq?'border-purple-200':'border-slate-100 opacity-80');card.innerHTML='<div class="flex justify-between"><h3 class="font-bold text-sm">'+n.title+'</h3>'+(done?'<span class="text-xs bg-emerald-100 px-2 py-0.5 rounded-full">OK</span>':n.free?'<span class="text-xs bg-green-100 px-2 py-0.5 rounded-full">GRATIS</span>':'<span class="text-xs bg-red-100 px-2 py-0.5 rounded-full">PRO</span>')+'</div><p class="text-xs">Requiere: <b>'+n.reqNames+'</b></p>'+(hasReq?'<button onclick="playNovel('+n.id+')" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold p-3 rounded-2xl text-xs">'+(done?'Volver a leer':'Resolver +40')+'</button>':'<div class="p-2.5 bg-amber-50 rounded-2xl text-[11px]">Completa '+n.reqNames+'</div>');list.appendChild(card);});}
function playNovel(id){const n=NOVELS.find(x=>x.id===id);if(!n.req.every(c=>user.completedCats.includes(c))){showFeedback(false,'Bloqueado');return;}let answers={};document.getElementById('modalGameTitle').innerText=n.title;document.getElementById('modalGame').classList.remove('hidden');document.getElementById('modalGame').classList.add('flex');const renderUI=()=>{let story=n.story.replace('{name}',user.name);n.blanks.forEach(b=>{const filled=answers[b];const word=getWord(findItem(b),user.learn);const html=filled?'<span class="font-bold text-indigo-600 underline bg-indigo-50 rounded-lg px-1">'+word+'</span>':'<span class="font-bold text-slate-400 border-b-2 border-indigo-400 px-3">___</span>';story=story.replace('['+b+']',html);});let need=n.blanks.find(b=>!answers[b]);const body=document.getElementById('modalGameBody');body.innerHTML='<div class="w-full space-y-4 text-left"><div class="p-4 bg-white border-2 border-indigo-100 rounded-3xl font-semibold">'+story+'</div>'+(need?'<div class="space-y-2"><p class="text-xs text-center font-bold">Elige:</p><div id="novelOpts" class="grid grid-cols-2 gap-2"></div></div>':'<button id="btnFinish" class="w-full bg-emerald-500 text-white font-bold p-4 rounded-2xl">Completar +40</button>')+'</div>';if(need){const target=findItem(need);let choices=[target];while(choices.length<4){let rc=n.req[Math.floor(Math.random()*n.req.length)];let ri=VOCAB[rc][Math.floor(Math.random()*VOCAB[rc].length)]; if(!choices.includes(ri)) choices.push(ri);}choices.sort(()=>Math.random()-.5);const opts=document.getElementById('novelOpts');choices.forEach(ch=>{const w=getWord(ch,user.learn);const btn=document.createElement('button');btn.className="p-3 bg-indigo-50 border-2 border-indigo-100 rounded-2xl font-bold text-sm";btn.innerText=ch.emoji+' '+w;btn.onclick=()=>{if(ch===target){answers[need]=true;renderUI();}else{btn.classList.add('border-red-400');}};opts.appendChild(btn);});}else{document.getElementById('btnFinish').onclick=()=>{if(!user.completedNovels.includes(n.id)){user.completedNovels.push(n.id);awardPoints(40);}window.onLunaClose=()=>{closeModalGame();renderNovels();};showFeedback(true,'+40');};}};renderUI();}
window.onload=()=>{loadUserData();updateHeader();renderCategories();renderNovels();document.getElementById('navH').classList.add('active-tab');};
</script>
</body>
</html>
