<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gluna Lingua Kids 8.5</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Fredoka',sans-serif;background:#FFF8E7;}
.card{transition:all.2s;}.card:active{transform:scale(.97);}
.logo-fix{width:56px;height:56px;background:linear-gradient(135deg,#6D28D9,#FBBF24);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 4px 12px rgba(109,40,217,.3);}
</style>
</head>
<body>
<header class="sticky top-0 bg-white/90 backdrop-blur-md px-4 py-3 flex items-center justify-between shadow-sm">
<div class="flex items-center gap-3"><div class="logo-fix">🌙</div><div><h1 class="font-bold text-[#6D28D9]">Gluna Lingua</h1><p class="text-[12px] text-gray-400 font-bold">KIDS 8.5</p></div></div>
<button onclick="goHome()" class="bg-[#F3F0FF] text-[#6D28D9] px-4 py-2 rounded-full text-sm font-bold">🏠 Inicio</button>
</header>
<main class="max-w-[480px] mx-auto px-4 pb-24">
<section id="view-home" class="pt-6">
<h2 class="text-[28px] font-bold">¡Hola Gaddiel! 👋</h2><p class="text-gray-500 mb-6">¿Qué hacemos hoy?</p>
<div class="grid gap-4">
<button onclick="showLearn()" class="bg-gradient-to-br from-violet-600 to-indigo-600 rounded-[28px] p-6 text-left text-white shadow-xl"><p class="text-[32px]">📚</p><h3 class="text-[24px] font-bold">APRENDER</h3><p class="opacity-80">10 categorías</p></button>
<button onclick="showNovela()" class="bg-gradient-to-br from-gray-900 to-gray-700 rounded-[28px] p-6 text-left text-white shadow-xl"><p class="text-[32px]">🌙</p><h3 class="text-[24px] font-bold">NOVELA PRO</h3><p class="opacity-70">Capítulo 1 GRATIS</p></button>
</div>
</section>
<section id="view-cats" class="hidden pt-6"><div class="flex gap-3 mb-4"><button onclick="goHome()" class="bg-white w-10 h-10 rounded-full shadow">←</button><h2 class="text-[22px] font-bold">Elige categoría</h2></div><div id="cats-grid" class="grid grid-cols-2 gap-3"></div></section>
<section id="view-games" class="hidden pt-6"><div class="flex gap-3 mb-2"><button onclick="showLearn()" class="bg-white w-10 h-10 rounded-full shadow">←</button><h2 id="current-cat-name" class="text-[22px] font-bold"></h2></div><p id="current-cat-desc" class="text-sm text-gray-500 mb-4"></p><div id="games-grid" class="grid grid-cols-2 gap-3"></div><div id="play-area" class="hidden mt-6 bg-white rounded-[24px] p-5 shadow-xl"><div class="flex justify-between mb-4"><h3 id="play-title" class="font-bold"></h3><button onclick="closePlay()" class="text-sm bg-gray-100 px-3 py-1 rounded-full">✕</button></div><div id="play-content" class="min-h-[200px] flex flex-col items-center justify-center"></div></div></section>
<section id="view-novela" class="hidden pt-6"><div class="flex gap-3 mb-4"><button onclick="goHome()" class="bg-white w-10 h-10 rounded-full shadow">←</button><h2 class="text-[22px] font-bold">🌙 Novela PRO</h2></div><div class="bg-white rounded-[24px] p-5 shadow border-2 border-violet-600"><span class="bg-violet-600 text-white text-[10px] px-2 py-1 rounded-full">GRATIS</span><h3 class="font-bold mt-2">Capítulo 1: El Despertar</h3><button class="mt-3 w-full bg-black text-white py-3 rounded-full font-bold">▶️ Jugar</button></div></section>
</main>
<script>
const CATS=[{id:'frutas',name:'Frutas',icon:'🍎',color:'from-red-400 to-orange-400',words:[['Apple','Manzana'],['Banana','Plátano'],['Orange','Naranja'],['Strawberry','Fresa'],['Grape','Uva']]},{id:'animales',name:'Animales',icon:'🦁',color:'from-amber-400 to-yellow-400',words:[['Dog','Perro'],['Cat','Gato'],['Lion','León']]},{id:'colores',name:'Colores',icon:'🎨',color:'from-violet-400 to-purple-400',words:[['Red','Rojo'],['Blue','Azul'],['Green','Verde']]},{id:'comida',name:'Comida',icon:'🍕',color:'from-orange-400 to-red-400',words:[['Pizza','Pizza'],['Water','Agua']]},{id:'numeros',name:'Números',icon:'🔢',color:'from-blue-400 to-cyan-400',words:[['One','Uno'],['Two','Dos']]},{id:'abecedario',name:'Abecedario',icon:'🔤',color:'from-emerald-400 to-teal-400',words:[['A','A'],['B','Be']]},{id:'casa',name:'Casa',icon:'🏠',color:'from-slate-400 to-gray-400',words:[['House','Casa'],['Door','Puerta']]},{id:'ropa',name:'Ropa',icon:'👕',color:'from-pink-400 to-rose-400',words:[['Shirt','Camisa']]},{id:'cuerpo',name:'Cuerpo',icon:'🙌',color:'from-orange-300 to-amber-300',words:[['Hand','Mano']]},{id:'basico',name:'Básico',icon:'👋',color:'from-indigo-400 to-violet-400',words:[['Hello','Hola']]}];
const GAMES=[{id:'cartas',name:'Cartas PRO',icon:'🃏',desc:'Flashcards'},{id:'quiz',name:'Quiz',icon:'🧩',desc:'Elige'},{id:'vf',name:'V / F',icon:'✅❌',desc:'Verdadero'},{id:'memoria',name:'Memoria',icon:'🧠',desc:'Parejas'},{id:'escucha',name:'Escucha',icon:'👂',desc:'Audio'},{id:'repite',name:'Repite',icon:'🎤',desc:'Voz'},{id:'deletrea',name:'Deletrea',icon:'🔤',desc:'Spell'},{id:'ordena',name:'Ordena',icon:'🔀',desc:'Orden'},{id:'completa',name:'Completa',icon:'✍️',desc:'Fill'},{id:'asocia',name:'Asocia',icon:'🔗',desc:'Match'},{id:'escribe',name:'Escribe',icon:'⌨️',desc:'Write'}];
let currentCat=null;
function hideAll(){document.querySelectorAll('section').forEach(s=>s.classList.add('hidden'))}
function goHome(){hideAll();document.getElementById('view-home').classList.remove('hidden')}
function showLearn(){hideAll();document.getElementById('view-cats').classList.remove('hidden');const g=document.getElementById('cats-grid');g.innerHTML='';CATS.forEach(c=>{g.innerHTML+=`<button onclick="openCat('${c.id}')" class="bg-gradient-to-br ${c.color} rounded-[20px] p-4 text-left text-white shadow"><div class="text-[32px]">${c.icon}</div><h3 class="font-bold">${c.name}</h3></button>`})}
function showNovela(){hideAll();document.getElementById('view-novela').classList.remove('hidden')}
function openCat(id){currentCat=CATS.find(x=>x.id===id);hideAll();document.getElementById('view-games').classList.remove('hidden');document.getElementById('current-cat-name').innerText=currentCat.icon+' '+currentCat.name;document.getElementById('current-cat-desc').innerText='11 juegos solo de '+currentCat.name;const grid=document.getElementById('games-grid');grid.innerHTML='';GAMES.forEach(g=>{grid.innerHTML+=`<button onclick="playGame('${g.id}')" class="bg-white rounded-[20px] p-3 text-left shadow"><div>${g.icon}</div><div class="font-bold text-sm">${g.name}</div><div class="text-[10px] text-gray-400">${currentCat.name}</div></button>`});document.getElementById('play-area').classList.add('hidden')}
function playGame(gid){const w=currentCat.words[Math.floor(Math.random()*currentCat.words.length)];document.getElementById('play-area').classList.remove('hidden');document.getElementById('play-title').innerText=gid+' - '+currentCat.name;document.getElementById('play-content').innerHTML=`<div class="text-center"><div class="text-[64px]">${currentCat.icon}</div><h2 class="text-3xl font-bold">${w[0]}</h2><p class="text-xl text-violet-600 font-bold">${w[1]}</p><button onclick="playGame('${gid}')" class="mt-4 bg-violet-600 text-white px-6 py-2 rounded-full">Siguiente →</button></div>`}
function closePlay(){document.getElementById('play-area').classList.add('hidden')}
goHome();
</script>
</body>
</html>
